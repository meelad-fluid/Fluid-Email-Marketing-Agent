<!-- POST-PURCHASE 3: Check-in, PLAIN TEXT, about a week after the order. How's it going, honest about
     shipping if it's been slow, reply to a real person, one text link. Paste the letter exactly as written. -->
<div class="email" data-plain="true">
  <div class="letter">
    <img class="letter-logo" src="{{LOGO_DARK}}" alt="">
    <p>{{OPENING}}</p>
    <p>{{PARAGRAPH_1}}</p>
    <p>{{PARAGRAPH_2}}</p>
    <p>{{PARAGRAPH_3}}</p>
    <p>{{STATUS_LINE}} <a href="#">{{STATUS_LINK}}</a></p>
    <p>{{REPLY_INVITE}}</p>
    <p>{{FEEDBACK_ASK}}</p>
    <p><a href="#">{{TEXT_LINK}}</a></p>
    <p><b>{{SIGN_OFF}}</b></p>
  </div>
  <div class="tx tx--fade" style="--from:#ffffff;--to:var(--footer-bg);--tx-h:56px"></div>
  <footer class="footer footer--slim">
    <img class="footer-logo" src="{{LOGO_FOOTER}}" alt="">
    <div class="social"><span>IG</span><span>FB</span><span>TT</span><span>YT</span></div>
    <div class="legal"><a href="#">Manage preferences</a> | <a href="#">Unsubscribe</a><br>{{LEGAL_LINE}}</div>
  </footer>
</div>
